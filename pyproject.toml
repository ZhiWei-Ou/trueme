[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trueme"
version = "0.1.0"
description = "Local, model-specific facial similarity for consenting photo pairs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "typer==0.20.0", "rich==14.2.0", "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88", "Pillow==12.0.0",
]

[project.optional-dependencies]
cpu = ["onnxruntime==1.20.1"]
gpu = ["onnxruntime-gpu==1.20.2"]
dev = ["pytest==8.4.2", "ruff==0.14.2", "build==1.3.0"]

[project.scripts]
trueme = "trueme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trueme.models" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
