<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" role="img" aria-labelledby="title desc">
  <title id="title">TrueMe — a score, a little personality</title>
  <desc id="desc">Illustrative SFace cosine scores with playful, uncalibrated captions. OpenCV's published LFW threshold is 0.363; it is a benchmark reference, not a TrueMe acceptance threshold. Scores do not establish identity or predict acceptance by another system. Sources and context are in the README.</desc>
  <rect width="880" height="680" rx="20" fill="#faf9f5"/>
  <g font-family="Inter, DejaVu Sans, Arial, sans-serif" fill="#292d29">
    <text x="64" y="61" font-size="13" letter-spacing="2.5" fill="#626b60">TRUEME / SFACE</text>
    <text x="64" y="113" font-size="32" font-weight="600">A score, a little personality.</text>
    <g font-size="12" letter-spacing="1.5" fill="#71766e">
      <text x="64" y="174">EXAMPLE SCORE</text>
      <text x="290" y="174">THE VIBE</text>
    </g>
    <g stroke="#dedfd6" stroke-width="1">
      <path d="M64 191H816 M64 267H816 M64 343H816 M64 419H816 M64 495H816 M64 571H816"/>
    </g>
    <g font-size="29" font-weight="500" fill="#526448">
      <text x="64" y="240">0.33</text>
      <text x="64" y="316">0.44</text>
      <text x="64" y="392">0.55</text>
      <text x="64" y="468">0.66</text>
      <text x="64" y="544">0.88</text>
    </g>
    <g font-size="23">
      <text x="290" y="238">Camera plot twist.</text>
      <text x="290" y="314">Familiar energy.</text>
      <text x="290" y="390">Signature style.</text>
      <text x="290" y="466">Main-character energy.</text>
      <text x="290" y="542">Copy-paste vibes.</text>
    </g>
    <a href="https://docs.opencv.org/4.12.0/d0/dd4/tutorial_dnn_face.html">
      <text x="64" y="608" font-size="14" fill="#526448">OpenCV LFW reference: 0.363</text>
    </a>
    <text x="64" y="638" font-size="13" fill="#656b61">Playful examples, not calibrated bands or identity / acceptance judgments.</text>
  </g>
</svg>
